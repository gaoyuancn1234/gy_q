# CSI2000 生产配置。选参只认 paper_trader 8 相位 + 多维指标。
# 标签 / 成交价 / 下单时钟必须同一套 (路线 B: 14:45 出分, 14:50 竞价)。
# 不做市值中性。不要把 CSI300 的 8% vol_target 抄过来。
model_id: M01
model_tag: M01-LGB-D3v3r-CSI2000
last_retrain: 2026-09
qlib_kernels: 2
# 日成交额下限(元)。10 万账户用 2e6, 不是机构常用的 2e7。
min_amount: 2000000.0
# CSI300 上标定的自适应 TopK, 中证2000 未做相位检验, 关掉。
adaptive_strategy: none
adaptive_thresholds:
- 0.3
- 0.6
close_cost: 0.0015
deal_price: close
# 0 = 信号日 14:50 收盘竞价; 1 = T+1 收盘 (旧口径)。
exec_lag: 0
initial_cash: 100000
instruments: csi2000
# 超额相对中证2000, 不是沪深300。
benchmark: 932000.CSI
model: LightGBM
model_cache_dir: factor_lab/results/rolling/predictions
open_cost: 0.0005
preset: alpha158_ovn
quality_cache_dir: factor_lab/results/signal_decay
# 8 日调仓。CSI2000 主段尚未单独重扫频率, 沿用已对账引擎。
rebalance_every: 8
rolling_config: D_expand_3v_3r
rolling_json_dir: factor_lab/results/rolling
state_dir: factor_lab/paper_trading
# 中证2000 单票 8% 止损会把正常波动当风险。
stop_loss: null
# 年化目标波动。exposure = clip(target/realized, 0.2, 1.0), 不加杠杆。
# 主段 2024-01-02~2026-09-11, 8 相位 vs 无约束:
#            Sharpe均值/最差   最差回撤   Sharpe配对p
#   null     0.75 / 0.61      -34.7%     —
#   tv16     0.78 / 0.69      -24.6%     0.35
#   tv20     0.80 / 0.73      -26.1%     0.065
#   tv25     0.87 / 0.75      -26.1%     0.003  <- 采用
# CSI300 的 8% 会把中证2000 敞口压到约三成, 不要用。
vol_target: 0.25
vol_window: 20
vol_min_exposure: 0.2
# 估不出波动率时的敞口 (开局 / 净值不足)。默认 0.6。
# 主段 8 相位 vs tv25+0.60: unk40 Sharpe +0.11 (p=0.008),
# 最差回撤 -26.1%→-21.4%, DSR/Sortino/Calmar/IR 均升。
vol_unknown_exposure: 0.40
# 单次调仓最多卖出只数。约 20% 替换, 避免全量换手吃成本。
n_drop: 20
test_end: '2027-02-09'
test_start: '2024-01-01'
# 三种子均值。单种子同配置 Sharpe 可差 ±0.3。
n_seeds: 3
# 名义 TopK。10 万实际约 55–62 仓 (涨停/整手/ADV)。
topk: 100
max_topk_by_capital: 100
