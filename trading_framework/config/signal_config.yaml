# 模型编号: M01-LGB-D3v3r-v{YYMM}
# M01 = 第一版模型, LGB = LightGBM, D3v3r = D_expand_3v_3r, v = 最后重训月份
model_id: M01
model_tag: M01-LGB-D3v3r
last_retrain: 2026-09
adaptive_strategy: A_topk_adaptive
adaptive_thresholds:
- 0.3
- 0.6
close_cost: 0.0015
deal_price: close

# 2026-09-02: 10 万实盘 (原 20 万)。10万 / TopK 8 = 每仓 12500 元，整手无压力。
#
# 股票池维持 CSI 300 时点成分股。当日曾切到 CSI 800，已回退，原因:
#   1. baostock 数据源故障，cn_data_csi800 从未生成;
#   2. ML 路径的 provider_uri 硬编码为 cn_data_bs (factor_lab/paper_trader.py 等)，
#      只改本文件的 instruments 不会真正切换数据源，反而会在 cn_data_bs 里
#      找不到 csi800 成分股列表 —— qlib 对缺失不报错，会返回全 NaN(沉默失败);
#   3. n_drop=2 / 5日调仓 / vol_target 8% 都是在 CSI 300 上做过三段验证的，
#      换池后这些参数全部失效，需重新验证。
initial_cash: 100000
instruments: csi300
model: LightGBM
model_cache_dir: factor_lab/results/rolling/predictions
open_cost: 0.0005
preset: alpha158_val
quality_cache_dir: factor_lab/results/signal_decay

# 调仓间隔 — 2026-09-04 由 5 日改为 8 日
#
# 旧依据 (20万资金 / 旧数据 / qlib 原生引擎 / 单种子):
#   1日 0.280   2日 1.063   5日 1.410   8日 0.740   10日 0.776   → 选 5 日
#
# 新依据 (10万 / 修正后数据 / 高保真引擎 / 三种子集成, tv=8% n_drop=2):
#              全期        2024      2025   2026-02~08(高波动)
#   调仓3日   0.93/-14.1%  1.75  0.43   0.10/-9.9%
#   调仓5日   0.95/-12.6%  1.94  1.16   0.90/-5.2%     <- 旧配置
#   调仓8日   1.08/-10.8%  2.00  1.24   1.89/-9.3%     <- 采用
#
# 三个区间全部改善且回撤同时收窄，没有一段变差。
#
# 未采用全期最高的 n_drop=1 调仓8日 (Sharpe 1.38): 它在 2026-02~08 高波动期
# 掉到 -0.04，属于典型的"全期好看、某段崩掉"——CLAUDE.md 的研究方法约束
# 要求单段最优默认按噪声处理，取各段都不差的配置。
#
# 结论与旧依据相反(8日从最差变最好)，成因可能是数据错位修复、引擎更换
# (旧引擎无 vol_target/止损/整手)、以及单种子改三种子集成。
# 旧数字建立在多个已知不成立的前提上，不再作为依据。
rebalance_every: 8
rolling_config: D_expand_3v_3r
rolling_json_dir: factor_lab/results/rolling
state_dir: factor_lab/paper_trading
stop_loss: 0.08

# 波动率目标 (2026-08-30 新增) — 年化目标波动率，null 关闭
# 按近期实现波动率反向缩放权益敞口: exposure = clip(target/realized, 0.2, 1.0)
# 不加杠杆。诊断依据: 2026-02~08 选股能力未衰减(超额日均+0.09%，与2024相当)，
# 但组合日波动从 1.14% 翻倍到 2.15%，同样的 alpha 承担两倍风险 → Sharpe 崩塌。
#
# 参数选择依据 (样本内 + 样本外双重验证, 不按单期最优挑选):
#            段1样本外(2022-05~2023-12)  2024-2026全期   2026-02~08困难期
#   基准        0.250 / -7.74%            0.47 / -20.4%   -0.03 / -9.1%
#   tv=6%       0.341 / -6.11%            0.48 / -14.2%    0.29 / -5.8%
#   tv=8%       0.318 / -6.58%            0.49 / -15.8%    0.74 / -4.2%
#   tv=10%      0.189 / -7.34%            0.54 / -16.7%    0.30 / -6.0%
#   tv=12%      0.186 / -7.79%            0.54 / -16.7%    0.48 / -5.3%
#
# tv=10%/12% 样本内最优但样本外跑输基线 → 典型的样本内过拟合。
# 只有 6%/8% 在两段都稳定优于基线; 取 8% 因平均敞口 89.8% (vs 6% 的 80.9%),
# 资金效率更高。注意 8% 在困难期的 0.74 相对邻近参数是异常值, 含噪声,
# 未作为选择依据。
#
# 2026-09-02: 曾上调到 12% 以适配 CSI 800 的中盘波动。股票池已回退到 CSI 300，
# 该理由不再成立 —— 恢复为上表中唯一在两段都稳定优于基线的 8%。
vol_target: 0.08
vol_window: 20
vol_min_exposure: 0.2

# 换手限制 (2026-08-30 新增) — 每次调仓最多替换几只持仓，null = 全量替换
#
# 原先是全量换手: 5 日调仓下几乎每次换掉全部 12 只，10万资金 2.5 年约 1734 笔
# 交易，双边成本 0.05%+0.15% 累积吃掉约本金的 14%。这是压低收益的首要原因。
#
#                    段1样本外(2022-05~2023-12)   2024-2026全期
#   全量换手 + tv=8%      0.332 / -6.6%             0.476 / -16.0%
#   n_drop=2            1.104 / -8.1%             1.219 / -12.0%
#   n_drop=2 + tv=8%    1.272 / -5.9%             1.162 / -11.5%   <- 采用
#   n_drop=3 + tv=8%    1.047 / -6.2%             0.893 / -12.8%
#   n_drop=5 + tv=8%    0.873 / -6.0%             0.733 / -12.7%
#
# 取 n_drop=2: 两段平均 Sharpe 最高 (1.22)，且回撤在两段都最优或接近最优。
#
# 2026-09-04: 2 → 4。TopK 由 8 提到 16 后，n_drop=4 才维持住原先验证过的
# 25% 替换率(2/8)。8 相位配对测试里 16/4 在均值、最差相位、均值-1σ 上都最好。
n_drop: 4
test_end: '2026-09-02'
test_start: '2024-01-01'

# 多种子集成 (2026-09-03 新增)
#
# LightGBM 原先一个随机种子都没设，而 bagging_fraction/feature_fraction
# 都依赖随机抽样 —— 同配置两次训练，主段 Sharpe 0.876 vs 1.449，
# 预测相关系数仅 0.9002，TopK 8 平均只有 7.1/8 只重叠。
# 也就是说单次回测的 Sharpe 有 ±0.3 量级的随机波动，
# 而 TopK 扫描里各档的差异只有 0.1~0.3 —— 完全淹没在噪声里。
#
# 固定种子只解决"可复现"，不解决"单次结果本身是一次抽样"：
# 实盘信号会取决于某个任意选定的种子。集成 N 个种子取预测均值，
# 把这部分方差按 ~1/sqrt(N) 压下去，同时让每次调仓的选股更稳定。
# 代价: 训练时间线性增加 (N=3 时重训约 60 分钟)。
n_seeds: 3

# 2026-09-04: 8 → 16
#
# 起因是模拟盘因 bug 实际持有 16 只，绩效反而明显好于修正后的 8 只。
# 直接对比是混淆的(同时改了调仓间隔)，所以重做了扫描，并发现之前所有
# 单次回测结论都不可靠 —— 8 日调仓在整段样本上只有约 81 次调仓，起始日
# 错开 1 天(相位 0..7)就是 8 组不同的样本，Sharpe 在相位间的标准差
# 0.11~0.32，而各 TopK 档之间的差异只有 0.1~0.16，完全淹没在里面。
#
# 改用 8 相位 × 2 段 = 16 个配对样本，相对现行 8/2 的配对差值:
#   配置    16相位均值  标准差  最差相位  均值-1σ  配对Δ  配对t  胜出相位
#   8/2       0.927    0.239   0.29    0.687     -      -      -
#   12/3      1.055    0.238   0.41    0.817   +0.129  2.12   11/16
#   16/2      1.041    0.229   0.35    0.813   +0.115  2.53   13/16
#   16/4      1.087    0.246   0.54    0.841   +0.160  2.74   12/16  <- 采用
#   20/5      0.998    0.167   0.62    0.831   +0.071  1.19   10/16
#
# 12/16/20 三档彼此没有显著差异，但 8 显著劣于前三档。取 16/4。
# 20 未取: 配对 t 仅 1.19，且每仓 5000 元时 16.3% 的仓位一手就占掉一半以上，
# 权重粒度开始失真。
#
# 警示: 段1 原先记录的 TopK=8 Sharpe 1.341 是相位0 的运气，8 相位均值仅
# 0.840、最差相位 0.29。本文件里任何单次回测得出的数字都要按这个量级打折。
#
# 注意: adaptive_strategy=A_topk_adaptive 会按信号质量覆盖此值
# (strong 12 / normal 16 / weak 20)，并受 max_topk_by_capital 上限约束。
topk: 16

# 资金约束下的 TopK 上限 (2026-09-03 新增)
# 自适应策略在 weak 档会把 TopK 提到 20，10万资金下每仓仅 5000 元 ——
# 沪深300 里相当一部分股票一手就超过这个数，那些仓位根本买不进去。
# 该上限让自适应结果不会超出资金能真实建仓的数量。
#
# 2026-09-04: 8 → 16。实测按全池算 TopK=16 有 22.3% 的股票买不起一手，
# 但模型实际选出的名单偏低价股(银行/钢铁)，只有 4.5% 买不起，平均能建
# 15.3/16 仓。到 20 才开始明显失真(16.3% 的仓位一手占掉一半以上)。
max_topk_by_capital: 16
